services:
    postgres:
        image: docker.io/library/postgres:${POSTRGES_VERSION}

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

        ports:
            - "${POSTGRES_PORT}:5432"

        volumes:
            - postgres-data:/var/lib/postgresql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

        networks:
            - backend

        restart: unless-stopped

    minio:
        image: quay.io/minio/minio:${MINIO_VERSION}

        command: server /data --console-address ":9001"
        
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

        ports:
            - "${MINIO_PORT}:9000"
            - "${MINIO_UI_PORT}:9001"

        volumes:
            - minio-data:/data

        networks:
            - backend


    hephaestus-api:
        build:
            context: ./api
            dockerfile: Dockerfile

        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            MINIO_ENDPOINT: http://minio:9000

            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

            HEPHAESTUS_PLUGIN_KEY: ${HEPHAESTUS_PLUGIN_KEY}

            JWT_SECRET: ${JWT_SECRET}

            HEPHAESTUS_ADMIN_USERNAME: ${HEPHAESTUS_ADMIN_USERNAME}
            HEPHAESTUS_ADMIN_PASSWORD: ${HEPHAESTUS_ADMIN_PASSWORD}

        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_started

        restart: on-failure

        networks:
            - backend

    hephaestus-web:
        build:
            context: ./web-app
            dockerfile: Dockerfile

        ports:
            - "4200:80"

        depends_on:
            - hephaestus-api

        networks:
            - backend

    minecraft:
        build:
            context: ./hephaestus
            dockerfile: Dockerfile

        environment:
            SYNC_SKIP_NEWER_IN_DESTINATION: "false"
            EULA: "TRUE"
            TYPE: PAPER
            VERSION: ${MINECRAFT_VERSION}
            MEMORY: ${MINECRAFT_MEMORY}

            HEPHAESTUS_API_URL: http://hephaestus-api:9003
            HEPHAESTUS_PLUGIN_KEY: ${HEPHAESTUS_PLUGIN_KEY}

        ports:
            - "${MINECRAFT_PORT}:25565"

        volumes:
            - minecraft-data:/data

        depends_on:
            - hephaestus-api

        networks:
            - backend

        stdin_open: true
        tty: true
        restart: unless-stopped

networks:
    backend:
        driver: bridge

volumes:
    postgres-data:
    minio-data:
    minecraft-data:
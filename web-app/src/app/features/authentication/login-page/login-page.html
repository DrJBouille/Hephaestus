<div class="w-screen h-screen flex justify-center items-center">
  <form class="w-1/5 flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()">

    <app-title label="Hephaestus"/>
    <app-subtitle label="Minecraft build server manager"/>

    <app-input label="Username" placeholder="username" [control]="form.controls.username" />

    <app-input label="Password" type="password" placeholder="********" [control]="form.controls.password" />

    @if (error()) {
      <div class="error">
        {{ error() }}
      </div>
    }

    @if (loading()) {
      <app-button label="Connecting..." [disabled]="true"/>
    } @else {
      <app-button label="Connect"/>
    }
  </form>
</div>
